<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Концерт билеттері</title><style>body{font:16px system-ui;background:#111827;color:white;max-width:950px;margin:auto;padding:16px}section{background:#202b3d;padding:16px;border-radius:12px;margin:12px 0}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #778399;margin:4px}button{cursor:pointer}button:disabled{opacity:.5}svg{display:block}#scroll{overflow:auto;max-height:65vh}#legend{line-height:2}small{color:#cbd5e1} .entry{border-bottom:1px solid #64748b;padding:10px;overflow-wrap:anywhere}</style><h1>Концерт • 210 орын</h1><section><div id="stats"></div><div id="legend">🔴 1500 ₸　🔵 800 ₸　🟤 500 ₸　🟢 Таңдалған　⚫ Бронь</div><button onclick="zoom(-25)">−</button><span id="z">100%</span><button onclick="zoom(25)">+</button><div id="scroll"><svg id="hall" viewBox="0 0 900 650" width="100%"></svg></div></section><section><h2>Билет брондау</h2><div id="choice"></div><p>Kaspi: <b>87083442087</b> — Дамир</p><button onclick="navigator.clipboard.writeText('87083442087')">Нөмірді көшіру</button><div><input id="name" placeholder="Аты-жөні" maxlength="100"><input id="phone" type="tel" placeholder="Телефон" maxlength="40"></div><button id="book" onclick="book()">Броньды растау</button><p id="msg" role="status"></p><small>Төлемді ұйымдастырушы қолмен тексереді.</small></section><section id="admin" hidden><h2>Админ панелі</h2><div id="login"><input id="password" type="password" placeholder="Админ құпиясөзі"><button onclick="login()">Кіру</button></div><div id="manage" hidden><button onclick="logout()">Шығу</button><div id="entries"></div></div></section><script>
const counts=[16,22,24,24,20,16,18,17,8,10,15,20],$=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let selected=new Set(),bookings=[],admin=false,scale=100;const price=s=>+s.split('-')[0]<=2?1500:+s.split('-')[0]<=5?800:500;const nodes={};function el(tag,a,t){let e=document.createElementNS(ns,tag);for(let k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;$('hall').append(e);return e}el('rect',{x:260,y:10,width:380,height:45,rx:12,fill:'#475569'});el('text',{x:450,y:39,fill:'white','text-anchor':'middle'},'САХНА');counts.forEach((n,r)=>{let w=245+r*12,b=85+r*43;for(let i=0;i<n;i++){let t=2*i/(n-1)-1,x=450+w*t,y=b+(35+r*2)*(1-t*t),s=`${r+1}-${i+1}`;let c=el('rect',{x:x-11,y:y-11,width:22,height:22,rx:5,stroke:'#ffffff33'}),l=el('text',{x,y:y+4,'font-size':11,'text-anchor':'middle','pointer-events':'none'},i+1);c.style.cursor='pointer';c.onclick=()=>{if(bookings.some(v=>v.seat===s))return;selected.has(s)?selected.delete(s):selected.add(s);paint()};nodes[s]={c,l,i};}el('text',{x:450-w-20,y:b+4,fill:'white','text-anchor':'end'},r+1);el('text',{x:450+w+20,y:b+4,fill:'white'},r+1)});
function zoom(d){scale=Math.max(100,Math.min(300,scale+d));$('hall').style.width=scale+'%';$('z').textContent=scale+'%'}function paint(){let taken=new Set(bookings.map(b=>b.seat));for(let s of taken)selected.delete(s);for(let [s,{c,l,i}] of Object.entries(nodes)){let sold=taken.has(s),p=price(s);c.setAttribute('fill',sold?'#555b66':selected.has(s)?'#22c55e':p===1500?'#dc394b':p===800?'#327de0':'#c7b49a');l.textContent=sold?'×':i+1;l.setAttribute('fill',!sold&&!selected.has(s)&&p===500?'#222':'white')} $('stats').textContent=`Бос: ${210-taken.size} | Бронь: ${taken.size}`;$('choice').textContent=[...selected].join(', ')+' | Жалпы: '+[...selected].reduce((a,s)=>a+price(s),0)+' ₸';$('book').disabled=!selected.size;}
async function api(path,data){let r=await fetch('/api/'+path,data===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Қате');return j}async function refresh(){try{let j=await api('seats');bookings=j.bookings;admin=j.admin;paint();$('login').hidden=admin;$('manage').hidden=!admin;if(admin){let e=$('entries');e.replaceChildren();for(let b of bookings){let d=document.createElement('div');d.className='entry';d.textContent=`${b.seat} | ${b.name} | ${b.phone} | ${price(b.seat)} ₸ | ${b.paid?'Төленген':'Тексерілмеген'}`;for(let [action,label] of [['paid','Төлемді растау'],['cancel','Броньды жою']]){let btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{if(!confirm(label+'?'))return;try{await api('manage',{seat:b.seat,action});await refresh()}catch(e){alert(e.message)}};d.append(btn)}if(b.paid&&b.token){let a=document.createElement('a');a.href='/ticket/'+encodeURIComponent(b.token);a.target='_blank';a.style.color='#93c5fd';a.textContent=' Электронды билет / QR';d.append(a);if(b.used)d.append(' · Кірген');}e.append(d)}}}catch(e){$('msg').textContent='Сервермен байланыс жоқ: '+e.message}}
async function book(){try{await api('book',{seats:[...selected],name:$('name').value,phone:$('phone').value});selected.clear();$('msg').textContent='Бронь қабылданды!';await refresh()}catch(e){$('msg').textContent=e.message;await refresh()}}async function login(){try{await api('login',{password:$('password').value});$('password').value='';await refresh()}catch(e){alert(e.message)}}async function logout(){await api('logout',{});await refresh()}$('admin').hidden=!location.search.includes('admin');paint();refresh();setInterval(refresh,3000);
</script></html>
